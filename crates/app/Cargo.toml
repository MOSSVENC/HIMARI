[package]
name = "himari"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
snapshot-tools = []
render-tracing = ["i-slint-renderer-skia/render-tracing"]

[dependencies]
himari-protocol = { path = "../protocol" }
raw-window-handle = { workspace = true }
slint = { workspace = true }
i-slint-renderer-skia = { version = "=1.17.0", default-features = false, features = ["vulkan"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[build-dependencies]
slint-build = { workspace = true }
embed-resource = "3.0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
skia-safe = { version = "=0.99.0", default-features = false, features = ["svg"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
] }
windows-registry = { workspace = true }
windows-service = { workspace = true }
windows-result = "0.4.1"
