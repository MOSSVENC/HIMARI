      <stop stop-color="#6d1229"/><stop offset="0.55" stop-color="#3d0a18"/><stop offset="1" stop-color="#18040b"/>
    </radialGradient>
    <linearGradient id="hair" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop stop-color="#fdfefe"/><stop offset="0.5" stop-color="#d5dfe9"/><stop offset="1" stop-color="#8e9dae"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.35" y1="0" x2="0.75" y2="1">
      <stop stop-color="#ffeade"/><stop offset="1" stop-color="#eebda4"/>
