name: verify

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt
      - name: Install Linux UI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: ./scripts/verify.sh

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy
      - name: Test Windows executable replacement
        shell: pwsh
        run: ./scripts/test-deployment.ps1 -DeploymentScript ./scripts/deploy.ps1
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks
      - run: cargo build --locked --release --workspace
